services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  api:
    image: smartcampus-ai-api:local
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      STAFF_SESSION_TTL_HOURS: ${STAFF_SESSION_TTL_HOURS:-12}
      CANDIDATE_SESSION_TTL_HOURS: ${CANDIDATE_SESSION_TTL_HOURS:-12}
      VISITOR_SESSION_TTL_HOURS: ${VISITOR_SESSION_TTL_HOURS:-24}
      VISITOR_MAX_MESSAGES: ${VISITOR_MAX_MESSAGES:-200}
      VISITOR_CREATIONS_PER_HOUR: ${VISITOR_CREATIONS_PER_HOUR:-300}
      CANDIDATE_REGISTRATIONS_PER_HOUR: ${CANDIDATE_REGISTRATIONS_PER_HOUR:-10}
      CANDIDATE_LOGIN_ATTEMPTS_PER_HOUR: ${CANDIDATE_LOGIN_ATTEMPTS_PER_HOUR:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-500}
      LLM_CONTEXT_MESSAGES: ${LLM_CONTEXT_MESSAGES:-12}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 20s

  retention:
    image: smartcampus-ai-api:local
    restart: unless-stopped
    command: ["python", "-m", "app.db.cleanup_loop"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-3600}
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  postgres_data:
