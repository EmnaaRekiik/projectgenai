name: SmartCampus API tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartcampus_ci
          POSTGRES_USER: smartcampus_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcampus_ci -d smartcampus_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://smartcampus_ci:ci_only_password@127.0.0.1:5432/smartcampus_ci
      TEST_DATABASE_URL: postgresql+psycopg://smartcampus_ci:ci_only_password@127.0.0.1:5432/smartcampus_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Apply migrations on real PostgreSQL
        run: python -m alembic upgrade head
      - name: Check migration matches ORM models
        run: python -m alembic check
      - name: Run API tests on real PostgreSQL
        run: python -m pytest -q
